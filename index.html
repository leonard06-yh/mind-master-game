<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mind Master 🧠🎮</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#071b12,#063b28,#0b5c3c);
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
    border:none;
}

.screen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
}

.hidden{
    display:none !important;
}

/* ================= LANDING ================= */

#landing{
    background:
    radial-gradient(circle at top,#15915d55,transparent 35%),
    linear-gradient(135deg,#03130c,#063b28,#087346);
}

.brain{
    font-size:90px;
    animation:float 2s infinite ease-in-out;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
}

.logo{
    font-size:48px;
    font-weight:bold;
    margin:10px 0;
}

.tagline{
    color:#c8f7df;
    margin-bottom:30px;
}

.play-btn{
    background:#d4af37;
    color:#111;
    padding:16px 38px;
    border-radius:40px;
    font-weight:bold;
    font-size:20px;
    box-shadow:0 0 25px #d4af3770;
    transition:.2s;
}

.play-btn:hover{
    transform:scale(1.06);
}

/* ================= MODE SCREEN ================= */

#modeScreen{
    background:
    radial-gradient(circle at center,#0c7d4f55,transparent 40%),
    linear-gradient(135deg,#03130c,#063b28);
}

.mode-title{
    font-size:38px;
    margin-bottom:10px;
}

.mode-subtitle{
    color:#bdebd4;
    margin-bottom:30px;
}

.modes{
    width:min(500px,100%);
    display:grid;
    gap:15px;
}

.mode-btn{
    padding:20px;
    border-radius:18px;
    color:white;
    background:#ffffff12;
    border:1px solid #ffffff20;
    transition:.2s;
}

.mode-btn:hover{
    transform:translateY(-3px);
    background:#ffffff20;
}

.mode-btn strong{
    display:block;
    font-size:22px;
    margin-bottom:6px;
}

.mode-btn small{
    color:#c7dacf;
}

.back-btn{
    margin-top:25px;
    background:transparent;
    color:#ddd;
    padding:10px 20px;
}

/* ================= GAME ================= */

.game{
    width:min(700px,100%);
    margin:auto;
    padding:20px;
    text-align:center;
}

.game-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.game-title{
    font-size:28px;
    font-weight:bold;
}

.sound-btn{
    background:#ffffff18;
    color:white;
    width:45px;
    height:45px;
    border-radius:50%;
    font-size:20px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:20px;
}

.stat{
    background:#ffffff10;
    border:1px solid #ffffff15;
    padding:12px 5px;
    border-radius:14px;
}

.stat span{
    display:block;
    font-size:12px;
    color:#a8c9b8;
}

.stat strong{
    font-size:20px;
}

.challenge-type{
    color:#d4af37;
    font-weight:bold;
    font-size:18px;
    margin-bottom:8px;
}

.instruction{
    color:#c7ded2;
    margin-bottom:18px;
}

.number-box{
    min-height:150px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#ffffff0d;
    border:2px solid #ffffff15;
    border-radius:25px;
    margin-bottom:20px;
    padding:20px;
    box-shadow:0 15px 40px #00000025;
}

.sequence{
    font-size:clamp(35px,9vw,65px);
    font-weight:bold;
    letter-spacing:8px;
    word-break:break-word;
}

.word-display{
    font-size:clamp(32px,8vw,58px);
    letter-spacing:7px;
}

.timer-container{
    height:9px;
    background:#ffffff18;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:20px;
}

.timer-bar{
    height:100%;
    width:100%;
    background:#d4af37;
    transition:width .1s linear;
}

.answer-area{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.answer-area input{
    flex:1;
    padding:15px;
    border-radius:12px;
    border:none;
    outline:none;
    font-size:18px;
    text-align:center;
}

.submit-btn{
    padding:15px 20px;
    border-radius:12px;
    background:#d4af37;
    color:#111;
    font-weight:bold;
}

.start-btn,
.restart-btn{
    padding:14px 25px;
    border-radius:30px;
    background:#087346;
    color:white;
    border:1px solid #ffffff25;
    margin:5px;
}

.result{
    min-height:30px;
    font-weight:bold;
    margin:10px 0;
}

.correct{
    color:#70f0ad;
}

.wrong{
    color:#ff8585;
}

.info{
    color:#b8d5c5;
    margin-top:15px;
}

#startButton{
    background:#d4af37;
    color:#111;
    font-weight:bold;
}

@media(max-width:600px){
    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .answer-area{
        flex-direction:column;
    }

    .submit-btn{
        width:100%;
    }

    .logo{
        font-size:38px;
    }
}
</style>
</head>

<body>

<!-- ================= LANDING ================= -->

<section id="landing" class="screen">

    <div class="brain">🧠</div>

    <div class="logo">MIND MASTER</div>

    <p class="tagline">
        Train your memory. Test your brain. Become the master. 🔥
    </p>

    <button class="play-btn" onclick="showModes()">
        PLAY NOW 🎮
    </button>

</section>


<!-- ================= MODE SCREEN ================= -->

<section id="modeScreen" class="screen hidden">

    <h1 class="mode-title">Choose Your Challenge</h1>

    <p class="mode-subtitle">
        How brave is your brain? 😈
    </p>

    <div class="modes">

        <button class="mode-btn" onclick="selectMode('classic')">
            <strong>🧠 Classic Mode</strong>
            <small>Balanced memory challenge</small>
        </button>

        <button class="mode-btn" onclick="selectMode('speed')">
            <strong>⚡ Speed Mode</strong>
            <small>Less time. More points.</small>
        </button>

        <button class="mode-btn" onclick="selectMode('impossible')">
            <strong>💀 Impossible Mode</strong>
            <small>One life. Maximum difficulty.</small>
        </button>

    </div>

    <button class="back-btn" onclick="backToLanding()">
        ← Back
    </button>

</section>


<!-- ================= GAME ================= -->

<main id="gameScreen" class="game hidden">

    <div class="game-header">

        <div class="game-title">
            🧠 Mind Master
        </div>

        <button class="sound-btn" onclick="toggleSound()" id="soundButton">
            🔊
        </button>

    </div>


    <div class="stats">

        <div class="stat">
            <span>LEVEL</span>
            <strong id="level">1</strong>
        </div>

        <div class="stat">
            <span>SCORE</span>
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            <span>BEST</span>
            <strong id="best">0</strong>
        </div>

        <div class="stat">
            <span>LIVES</span>
            <strong id="lives">❤️❤️❤️</strong>
        </div>

    </div>


    <div class="challenge-type" id="challengeType">
        🔢 NUMBER MEMORY
    </div>

    <p class="instruction" id="instruction">
        Remember the sequence!
    </p>


    <div class="number-box">

        <div id="sequence" class="sequence">
            READY?
        </div>

    </div>


    <div class="timer-container">
        <div id="timerBar" class="timer-bar"></div>
    </div>


    <div class="answer-area">

        <input
            id="answerInput"
            type="text"
            autocomplete="off"
            placeholder="Enter your answer..."
        >

        <button class="submit-btn" onclick="checkAnswer()">
            SUBMIT
        </button>

    </div>


    <div id="result" class="result"></div>


    <button
        id="startButton"
        class="start-btn"
        onclick="startRound()"
    >
        START CHALLENGE
    </button>

    <button
        class="restart-btn"
        onclick="restartGame()"
    >
        🔄 Restart
    </button>

    <p class="info" id="modeInfo">
        Classic Mode
    </p>

</main>


<script>

/* =========================================
   GAME VARIABLES
========================================= */

let mode = "classic";

let level = 1;
let score = 0;
let lives = 3;

let currentAnswer = "";
let challengeType = "";

let waitingForAnswer = false;

let countdownTimer;
let timerInterval;

let soundEnabled = true;

let best = Number(localStorage.getItem("mindMasterBest")) || 0;

document.getElementById("best").textContent = best;


/* =========================================
   SCREEN CONTROL
========================================= */

function showModes(){

    document.getElementById("landing").classList.add("hidden");

    document.getElementById("modeScreen").classList.remove("hidden");

}


function backToLanding(){

    document.getElementById("modeScreen").classList.add("hidden");

    document.getElementById("landing").classList.remove("hidden");

}


function selectMode(selectedMode){

    mode = selectedMode;

    document.getElementById("modeScreen").classList.add("hidden");

    document.getElementById("gameScreen").classList.remove("hidden");

    resetGame();

}


/* =========================================
   SOUND SYSTEM
========================================= */

let audioContext;


function getAudio(){

    if(!audioContext){

        audioContext =
            new (window.AudioContext || window.webkitAudioContext)();

    }

    return audioContext;
}


function playSound(type){

    if(!soundEnabled) return;

    const audio = getAudio();

    const oscillator = audio.createOscillator();

    const gain = audio.createGain();

    oscillator.connect(gain);

    gain.connect(audio.destination);


    if(type === "correct"){

        oscillator.frequency.value = 700;

    }

    else if(type === "wrong"){

        oscillator.frequency.value = 180;

    }

    else if(type === "level"){

        oscillator.frequency.value = 900;

    }

    else{

        oscillator.frequency.value = 400;

    }


    gain.gain.setValueAtTime(.15,audio.currentTime);

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audio.currentTime + .3
    );

    oscillator.start();

    oscillator.stop(audio.currentTime + .3);

}


/* =========================================
   BACKGROUND MUSIC
========================================= */

let musicTimer;

function startMusic(){

    if(!soundEnabled) return;

    if(musicTimer) return;

    const audio = getAudio();

    const notes = [
        261.63,
        329.63,
        392.00,
        329.63,
        293.66,
        349.23,
        440.00,
        349.23
    ];

    let index = 0;

    musicTimer = setInterval(() => {

        if(!soundEnabled) return;

        const oscillator = audio.createOscillator();

        const gain = audio.createGain();

        oscillator.connect(gain);

        gain.connect(audio.destination);

        oscillator.frequency.value = notes[index];

        oscillator.type = "sine";

        gain.gain.setValueAtTime(.025,audio.currentTime);

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audio.currentTime + .45
        );

        oscillator.start();

        oscillator.stop(audio.currentTime + .45);

        index++;

        if(index >= notes.length){
            index = 0;
        }

    },600);

}


function stopMusic(){

    clearInterval(musicTimer);

    musicTimer = null;

}


function toggleSound(){

    soundEnabled = !soundEnabled;

    const button =
        document.getElementById("soundButton");

    if(soundEnabled){

        button.textContent = "🔊";

        startMusic();

    }else{

        button.textContent = "🔇";

        stopMusic();

    }

}


/* =========================================
   CHALLENGE TYPES
========================================= */

function chooseChallenge(){

    const types = [
        "number",
        "letters",
        "spelling",
        "scramble",
        "mixed"
    ];

    /*
      Make early levels easier.
      More challenge types unlock as
      the player progresses.
    */

    if(level <= 2){

        return Math.random() < .5
            ? "number"
            : "letters";

    }

    if(level <= 4){

        return types[
            Math.floor(Math.random() * 3)
        ];

    }

    return types[
        Math.floor(Math.random() * types.length)
    ];

}


/* =========================================
   WORD BANK
========================================= */

const words = [

    "APPLE",
    "HOUSE",
    "CHAIR",
    "PLANT",
    "PHONE",
    "WATER",
    "BRAIN",
    "LIGHT",
    "MUSIC",
    "TIGER",
    "RIVER",
    "SCHOOL",
    "TABLE",
    "CLOUD",
    "DREAM",
    "MONEY",
    "POWER",
    "SMILE",
    "TRAIN",
    "WORLD",
    "CROWN",
    "BOOK",
    "GAME",
    "FRIEND",
    "MASTER",
    "COMPUTER",
    "MEMORY",
    "FUTURE",
    "SUCCESS",
    "CHAMPION"

];


/* =========================================
   RANDOM HELPERS
========================================= */

function randomNumber(length){

    let result = "";

    for(let i = 0; i < length; i++){

        result += Math.floor(Math.random() * 10);

    }

    return result;

}


function randomLetters(length){

    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    let result = "";

    for(let i = 0; i < length; i++){

        result += alphabet[
            Math.floor(Math.random() * alphabet.length)
        ];

    }

    return result;

}


function shuffleWord(word){

    let letters = word.split("");

    for(let i = letters.length - 1; i > 0; i--){

        const j =
            Math.floor(Math.random() * (i + 1));

        [letters[i],letters[j]] =
            [letters[j],letters[i]];

    }

    return letters.join("");

}


/* =========================================
   GENERATE CHALLENGE
========================================= */

function generateChallenge(){

    challengeType = chooseChallenge();

    const display =
        document.getElementById("sequence");

    const type =
        document.getElementById("challengeType");

    const instruction =
        document.getElementById("instruction");


    /* NUMBER */

    if(challengeType === "number"){

        const length =
            Math.min(4 + Math.floor(level / 2),12);

        currentAnswer =
            randomNumber(length);

        type.textContent = "🔢 NUMBER MEMORY";

        instruction.textContent =
            "Remember the numbers!";

        display.className = "sequence";

        display.textContent = currentAnswer;

    }


    /* LETTERS */

    else if(challengeType === "letters"){

        const length =
            Math.min(3 + Math.floor(level / 2),10);

        currentAnswer =
            randomLetters(length);

        type.textContent = "🔤 LETTER MEMORY";

        instruction.textContent =
            "Remember the letters in order!";

        display.className = "sequence";

        display.textContent = currentAnswer;

    }


    /* SPELLING */

    else if(challengeType === "spelling"){

        let available =
            words.filter(word =>
                word.length <= 4 + Math.floor(level / 2)
            );

        if(available.length === 0){
            available = words;
        }

        currentAnswer =
            available[
                Math.floor(Math.random() * available.length)
            ];

        type.textContent = "📝 SPELL IT!";

        instruction.textContent =
            "Remember the word and spell it!";

        display.className = "word-display";

        display.textContent = currentAnswer;

    }


    /* SCRAMBLE */

    else if(challengeType === "scramble"){

        let available =
            words.filter(word =>
                word.length >= 4 &&
                word.length <= 5 + Math.floor(level / 2)
            );

        if(available.length === 0){
            available = words;
        }

        currentAnswer =
            available[
                Math.floor(Math.random() * available.length)
            ];

        const scrambled =
            shuffleWord(currentAnswer);

        type.textContent = "🧩 WORD MASTER";

        instruction.textContent =
            "Rearrange the letters and form the correct word!";

        display.className = "word-display";

        display.textContent = scrambled;

    }


    /* MIXED */

    else if(challengeType === "mixed"){

        const number =
            randomNumber(2 + Math.floor(level / 2));

        const letters =
            randomLetters(2 + Math.floor(level / 2));

        let mixed = "";

        for(let i = 0; i < number.length; i++){

            mixed += number[i];

            if(letters[i]){
                mixed += letters[i];
            }

        }

        currentAnswer = mixed;

        type.textContent = "🔀 MIXED MEMORY";

        instruction.textContent =
            "Remember the numbers and letters exactly!";

        display.className = "sequence";

        display.textContent = currentAnswer;

    }

}


/* =========================================
   START ROUND
========================================= */

function startRound(){

    clearInterval(timerInterval);

    clearInterval(countdownTimer);

    document.getElementById("result").textContent = "";

    document.getElementById("answerInput").value = "";

    document.getElementById("answerInput").disabled = true;

    document.getElementById("startButton").disabled = true;

    generateChallenge();

    startMusic();

    let displayTime;

    if(mode === "classic"){

        displayTime =
            Math.max(1300,3200 - (level - 1) * 170);

    }

    else if(mode === "speed"){

        displayTime =
            Math.max(700,2200 - (level - 1) * 130);

    }

    else{

        displayTime =
            Math.max(450,1500 - (level - 1) * 100);

    }


    document.getElementById("timerBar").style.width = "100%";

    setTimeout(() => {

        document.getElementById("sequence").textContent =
            "••••";

        document.getElementById("instruction").textContent =
            "Now enter what you remember!";

        document.getElementById("answerInput").disabled = false;

        document.getElementById("answerInput").focus();

        waitingForAnswer = true;

        startCountdown();

    },displayTime);

}


/* =========================================
   COUNTDOWN
========================================= */

function startCountdown(){

    let totalTime;

    if(mode === "classic"){

        totalTime =
            Math.max(5000,7000 - level * 150);

    }

    else if(mode === "speed"){

        totalTime =
            Math.max(2500,4500 - level * 120);

    }

    else{

        totalTime =
            Math.max(1200,2800 - level * 100);

    }


    const start = Date.now();

    timerInterval = setInterval(() => {

        const elapsed =
            Date.now() - start;

        const remaining =
            Math.max(0,totalTime - elapsed);

        const percentage =
            (remaining / totalTime) * 100;

        document.getElementById("timerBar").style.width =
            percentage + "%";


        if(remaining <= 0){

            clearInterval(timerInterval);

            if(waitingForAnswer){

                waitingForAnswer = false;

                loseLife();

            }

        }

    },50);

}


/* =========================================
   CHECK ANSWER
========================================= */

function checkAnswer(){

    if(!waitingForAnswer) return;

    waitingForAnswer = false;

    clearInterval(timerInterval);

    const input =
        document.getElementById("answerInput");

    const userAnswer =
        input.value.trim().toUpperCase();

    input.disabled = true;


    if(userAnswer === currentAnswer){

        playSound("correct");

        let multiplier = 1;

        if(mode === "speed"){
            multiplier = 2;
        }

        if(mode === "impossible"){
            multiplier = 3;
        }

        const points =
            (10 + level * 2) * multiplier;

        score += points;

        document.getElementById("score").textContent =
            score;


        document.getElementById("result").innerHTML =
            `<span class="correct">
                ✅ CORRECT! +${points} points
            </span>`;


        if(score > best){

            best = score;

            localStorage.setItem(
                "mindMasterBest",
                best
            );

            document.getElementById("best").textContent =
                best;

        }


        level++;

        document.getElementById("level").textContent =
            level;

        playSound("level");

        setTimeout(() => {

            startRound();

        },1000);

    }

    else{

        document.getElementById("result").innerHTML =
            `<span class="wrong">
                ❌ WRONG! Correct answer: ${currentAnswer}
            </span>`;

        playSound("wrong");

        loseLife();

    }

}


/* =========================================
   LOSE LIFE
========================================= */

function loseLife(){

    lives--;

    updateLives();

    waitingForAnswer = false;

    document.getElementById("answerInput").disabled = true;

    if(lives <= 0){

        endGame();

        return;

    }


    document.getElementById("result").innerHTML =
        `<span class="wrong">
            ❤️ Life lost!
        </span>`;


    setTimeout(() => {

        startRound();

    },1000);

}


/* =========================================
   UPDATE LIVES
========================================= */

function updateLives(){

    let hearts = "";

    for(let i = 0; i < lives; i++){

        hearts += "❤️";

    }

    if(lives === 0){

        hearts = "💔";

    }

    document.getElementById("lives").textContent =
        hearts;

}


/* =========================================
   END GAME
========================================= */

function endGame(){

    clearInterval(timerInterval);

    clearInterval(countdownTimer);

    waitingForAnswer = false;

    document.getElementById("answerInput").disabled = true;

    document.getElementById("startButton").disabled = false;

    document.getElementById("startButton").textContent =
        "PLAY AGAIN 🎮";


    document.getElementById("result").innerHTML =

        `<span class="wrong">
            💀 GAME OVER!
            <br>
            Final Score: ${score}
            <br>
            Level Reached: ${level}
        </span>`;

    playSound("wrong");

}


/* =========================================
   RESET GAME
========================================= */

function resetGame(){

    clearInterval(timerInterval);

    clearInterval(countdownTimer);

    level = 1;

    score = 0;

    if(mode === "impossible"){

        lives = 1;

    }else{

        lives = 3;

    }

    currentAnswer = "";

    waitingForAnswer = false;


    document.getElementById("level").textContent =
        level;

    document.getElementById("score").textContent =
        score;

    document.getElementById("best").textContent =
        best;

    updateLives();


    document.getElementById("sequence").textContent =
        "READY?";

    document.getElementById("challengeType").textContent =
        "🧠 GET READY";

    document.getElementById("instruction").textContent =
        "Press START to begin.";

    document.getElementById("result").textContent = "";

    document.getElementById("answerInput").value = "";

    document.getElementById("answerInput").disabled = true;

    document.getElementById("startButton").disabled = false;

    document.getElementById("startButton").textContent =
        "START CHALLENGE";

    document.getElementById("timerBar").style.width =
        "100%";


    let modeName =
        mode.charAt(0).toUpperCase() +
        mode.slice(1);

    document.getElementById("modeInfo").textContent =
        modeName + " Mode";

}


/* =========================================
   RESTART
========================================= */

function restartGame(){

    resetGame();

}


/* =========================================
   ENTER KEY
========================================= */

document.getElementById("answerInput")
    .addEventListener("keydown",function(event){

        if(event.key === "Enter"){

            checkAnswer();

        }

    });


/* =========================================
   INITIAL SETUP
========================================= */

updateLives();

</script>

</body>
</html>
```
