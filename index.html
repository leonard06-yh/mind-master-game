<!-- =====================================================
     GENERIC GAME CONTAINER
===================================================== -->

<main id="game" class="game hidden">

    <div class="game-header">

        <div class="game-title" id="gameTitle">
            🧠 Mind Master
        </div>

        <div class="header-buttons">

            <button class="icon-btn" onclick="showHub()">
                🎮
            </button>

                class="icon-btn"
                id="soundBtn"
                onclick="toggleSound()"
            >
                🔊
            </button>

        </div>

    </div>


    <div class="stats">

        <div class="stat">
            <span>LEVEL</span>

        </div>

        <div class="stat">
            <span>SCORE</span>
            <strong id="score">0</strong>
        </div>

        <div class="stat">
            <span>BEST</span>
            <strong id="best">0</strong>

<script>

/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentGame="";

let level=1;
let score=0;
let lives=3;

let timer;
let gameRunning=false;

let soundEnabled=true;

let audioContext;

let bestScores=
JSON.parse(localStorage.getItem("mindMasterScores")||"{}");


/* =====================================================
   SCREEN CONTROL
===================================================== */

function hideScreens(){

    document.getElementById("landing")
        .classList.add("hidden");

    document.getElementById("hub")
        .classList.add("hidden");

    document.getElementById("game")
        .classList.add("hidden");

}


function showLanding(){

    stopGame();

    hideScreens();

    document.getElementById("landing")
        .classList.remove("hidden");

}


function showHub(){

    stopGame();

    hideScreens();

    document.getElementById("hub")
        .classList.remove("hidden");

}


function openGame(game){

    stopGame();

    currentGame=game;

    level=1;
    score=0;
    lives=3;

    hideScreens();

    document.getElementById("game")
        .classList.remove("hidden");

    updateStats();

    startSelectedGame();

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    document.getElementById("level").textContent=level;

    document.getElementById("score").textContent=score;

    let best=
        bestScores[currentGame]||0;

    document.getElementById("best").textContent=best;

    let hearts="";

    for(let i=0;i<lives;i++){
        hearts+="❤️";
    }

    if(lives<=0){
        hearts="💔";
    }

    document.getElementById("lives").textContent=hearts;

}


function addScore(points){

    score+=points;

    if(score>(bestScores[currentGame]||0)){

        bestScores[currentGame]=score;

        localStorage.setItem(
            "mindMasterScores",
            JSON.stringify(bestScores)
        );

    }

    updateStats();

}


function loseLife(){

    lives--;

    updateStats();

    if(lives<=0){

        gameOver();

        return true;

    }

    return false;

}


function nextLevel(){

    level++;

    updateStats();

}


/* =====================================================
   SOUND
===================================================== */

function audio(){

    if(!audioContext){

        audioContext=
        new(window.AudioContext||window.webkitAudioContext)();

    }

    return audioContext;

}


function sound(type){

    if(!soundEnabled)return;

    const a=audio();

    const o=a.createOscillator();

    const g=a.createGain();

    o.connect(g);

    g.connect(a.destination);

    if(type==="correct"){
        o.frequency.value=700;
    }
    else if(type==="wrong"){
        o.frequency.value=180;
    }
    else if(type==="win"){
        o.frequency.value=900;
    }
    else{
        o.frequency.value=400;
    }

    g.gain.setValueAtTime(.12,a.currentTime);

    g.gain.exponentialRampToValueAtTime(
        .001,
        a.currentTime+.3
    );

    o.start();

    o.stop(a.currentTime+.3);

}


function toggleSound(){

    soundEnabled=!soundEnabled;

    document.getElementById("soundBtn")
        .textContent=
        soundEnabled?"🔊":"🔇";

}


/* =====================================================
   GAME STARTER
===================================================== */

function startSelectedGame(){

    if(currentGame==="memory"){
        memoryGame();
    }

    if(currentGame==="word"){
        wordGame();
    }

    if(currentGame==="cards"){
        cardGame();
    }

    if(currentGame==="rush"){
        numberRush();
    }

    if(currentGame==="tap"){
        quickTap();
    }

    if(currentGame==="odd"){
        oddOneOut();
    }

    if(currentGame==="sequence"){
        sequenceMaster();
    }

    if(currentGame==="color"){
        colorChallenge();
    }

}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    stopGame();

    sound("wrong");

    document.getElementById("gameContent").innerHTML=`

        <div class="game-over">

            <h2>💀 GAME OVER!</h2>

            <br>

            <p>
                Final Score: <strong>${score}</strong>
            </p>

            <p>
                Level Reached: <strong>${level}</strong>
            </p>

            <br>

            <button
                class="primary"
                onclick="restartCurrentGame()"
            >
                PLAY AGAIN 🎮
            </button>

            <button
                class="secondary"
                onclick="showHub()"
            >
                GAME HUB
            </button>

        </div>

    `;

}


function restartCurrentGame(){

    openGame(currentGame);

}


function stopGame(){

    clearInterval(timer);

    clearTimeout(timer);

    gameRunning=false;

}


/* =====================================================
   1. MEMORY NUMBERS
===================================================== */

let memoryAnswer="";
let memoryWaiting=false;


function memoryGame(){

    document.getElementById("gameTitle").textContent=
        "🧠 Memory Numbers";

    document.getElementById("gameContent").innerHTML=`

        <h2 id="memoryType">
            🔢 NUMBER MEMORY
        </h2>

        <p class="instruction" id="memoryInstruction">
            Remember the sequence!
        </p>

        <div class="memory-display">

            <div
                id="memoryDisplay"
                class="big-text"
            >
                READY?
            </div>

        </div>

        <div class="timer">
            <div
                id="memoryTimer"
                class="timer-bar"
            ></div>
        </div>

        <div class="answer-row">

            <input
                id="memoryInput"
                class="input"
                placeholder="Enter your answer"
                disabled
            >

            <button
                class="primary"
                onclick="checkMemory()"
            >
                SUBMIT
            </button>

        </div>

        <div
            id="memoryResult"
            class="result"
        ></div>

        <button
            id="memoryStart"
            class="primary"
            onclick="startMemoryRound()"
        >
            START CHALLENGE
        </button>

    `;

}


function randomDigits(n){

    let s="";

    for(let i=0;i<n;i++){

        s+=Math.floor(Math.random()*10);

    }

    return s;

}


function randomWord(){

    const words=[
        "APPLE","HOUSE","BRAIN","MUSIC",
        "TIGER","WATER","LIGHT","PHONE",
        "RIVER","SCHOOL","MASTER","MEMORY"
    ];

    return words[
        Math.floor(Math.random()*words.length)
    ];

}


function startMemoryRound(){

    clearInterval(timer);

    memoryWaiting=false;

    const display=
        document.getElementById("memoryDisplay");

    const input=
        document.getElementById("memoryInput");

    input.value="";
    input.disabled=true;

    let type=Math.floor(Math.random()*3);

    if(type===0){

        memoryAnswer=
            randomDigits(
                Math.min(4+Math.floor(level/2),12)
            );

        document.getElementById("memoryType")
            .textContent="🔢 NUMBER MEMORY";

    }

    else if(type===1){

        const alphabet="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

        memoryAnswer="";

        for(let i=0;i<Math.min(3+Math.floor(level/2),10);i++){

            memoryAnswer+=
                alphabet[
                    Math.floor(
                        Math.random()*alphabet.length
                    )
                ];

        }

        document.getElementById("memoryType")
            .textContent="🔤 LETTER MEMORY";

    }

    else{

        memoryAnswer=randomWord();

        document.getElementById("memoryType")
            .textContent="📝 WORD MEMORY";

    }

    display.textContent=memoryAnswer;

    document.getElementById("memoryInstruction")
        .textContent="Remember it!";

    document.getElementById("memoryStart")
        .disabled=true;

    let displayTime=
        Math.max(
            1000,
            3000-(level*120)
        );

    setTimeout(()=>{

        display.textContent="••••";

        document.getElementById("memoryInstruction")
            .textContent="Now enter what you remember!";

        input.disabled=false;

        input.focus();

        memoryWaiting=true;

        startMemoryTimer();

    },displayTime);

}


function startMemoryTimer(){

    const total=
        Math.max(3000,6500-level*150);

    const start=Date.now();

    timer=setInterval(()=>{

        const remaining=
            Math.max(
                0,
                total-(Date.now()-start)
            );

        document.getElementById("memoryTimer")
            .style.width=
            (remaining/total*100)+"%";

        if(remaining<=0){

            clearInterval(timer);

            if(memoryWaiting){

                memoryWaiting=false;

                memoryWrong();

            }

        }

    },50);

}


function checkMemory(){

    if(!memoryWaiting)return;

    memoryWaiting=false;

    clearInterval(timer);

    const input=
        document.getElementById("memoryInput");

    const answer=
        input.value.trim().toUpperCase();

    input.disabled=true;

    if(answer===memoryAnswer){

        sound("correct");

        const points=10+level*2;

        addScore(points);

        document.getElementById("memoryResult")
            .innerHTML=
            `<span class="correct">
            ✅ CORRECT! +${points}
            </span>`;

        nextLevel();

        setTimeout(startMemoryRound,900);

    }
    else{

        memoryWrong();

    }

}


function memoryWrong(){

    sound("wrong");

    if(loseLife())return;

    document.getElementById("memoryResult")
        .innerHTML=
        `<span class="wrong">
        ❌ Wrong! Answer: ${memoryAnswer}
        </span>`;

    setTimeout(startMemoryRound,1000);

}

===================================================== */

let wordAnswer="";
let selectedWord="";


function wordGame(){

        </div>

        <div

            class="result"

        <button

            onclick="startWordRound()"
        >
            START WORD
        </button>

    `;

}


function shuffleArray(arr){

    return arr.sort(
        ()=>Math.random()-.5
    );

}


function startWordRound(){

    clearInterval(timer);

    const words=[
        "CAT","DOG","SUN","BOOK",
        "TREE","APPLE","HOUSE",
        "PHONE","MUSIC","TIGER",
        "BRAIN","WATER","MASTER",
        "COMPUTER","SUCCESS"
    ];

    wordAnswer=
        words[
            Math.floor(Math.random()*words.length)
        ];

    selectedWord="";

    document.getElementById("selectedLetters")
        .textContent="_";

    let letters=
        shuffleArray(wordAnswer.split(""));

    const box=
        document.getElementById("letterBox");

    box.innerHTML="";

    letters.forEach((letter,index)=>{

        const b=document.createElement("button");

        b.className="letter";

        b.textContent=letter;

        b.onclick=()=>{

            if(b.disabled)return;

            selectedWord+=letter;

            b.disabled=true;

            b.style.opacity=".35";

            document.getElementById("selectedLetters")
                .textContent=
                selectedWord;

            if(selectedWord.length===wordAnswer.length){

                checkWord();

            }

        };

        box.appendChild(b);

    });

    startWordTimer();

}


function startWordTimer(){

    const total=
        Math.max(3500,7000-level*150);

    const start=Date.now();

    timer=setInterval(()=>{

        const remaining=
            Math.max(
                0,
                total-(Date.now()-start)
            );

        document.getElementById("wordTimer")
            .style.width=
            (remaining/total*100)+"%";

        if(remaining<=0){

            clearInterval(timer);

            sound("wrong");

            if(loseLife())return;

            document.getElementById("wordResult")
                .innerHTML=
                `<span class="wrong">
                ⏰ Time's up! Word: ${wordAnswer}
                </span>`;

            setTimeout(startWordRound,1000);

        }

    },50);

}


function checkWord(){

    clearInterval(timer);

    if(selectedWord===wordAnswer){

        sound("correct");

        const points=
            15+level*3;

        addScore(points);

        document.getElementById("wordResult")
            .innerHTML=
            `<span class="correct">
            🎉 CORRECT! +${points}
            </span>`;

        nextLevel();

        setTimeout(startWordRound,900);

    }

}

let cards=[];
let firstCard=null;
let secondCard=null;
let lockCards=false;
let matches=0;


function cardGame(){

    document.getElementById("gameTitle").textContent=
        "🃏 Memory Cards";

    document.getElementById("gameContent").innerHTML=`

        <h2>🃏 FIND THE PAIRS</h2>

        <p class="instruction">
            Match all the cards.
        </p>

        <div
            id="cardGrid"
            class="card-grid"
        ></div>

        <div
            id="cardResult"
            class="result"
        ></div>

        <button
            class="primary"
            onclick="startCards()"
        >
            NEW GAME
        </button>

    `;

    startCards();

}


function startCards(){

    clearInterval(timer);

    const symbols=
        ["🍎","🍌","🍇","🍉","⭐","🔥","🎮","🧠"];

    cards=
        shuffleArray(
            [...symbols,...symbols]
        );

    firstCard=null;
    secondCard=null;
    lockCards=false;
    matches=0;

    const grid=
        document.getElementById("cardGrid");

    grid.innerHTML="";

    cards.forEach((symbol,index)=>{

        const card=
            document.createElement("button");

        card.className="memory-card";

        card.textContent="?";

        card.dataset.symbol=symbol;

        card.onclick=()=>flipCard(card);

        grid.appendChild(card);

    });

}


function flipCard(card){

    if(
        lockCards||
        card.classList.contains("flipped")||
        card.classList.contains("matched")
    )return;

    card.classList.add("flipped");

    card.textContent=
        card.dataset.symbol;

    if(!firstCard){

        firstCard=card;

        return;

    }

    secondCard=card;

    lockCards=true;

    if(
        firstCard.dataset.symbol===
        secondCard.dataset.symbol
    ){

        firstCard.classList.add("matched");

        secondCard.classList.add("matched");

        matches++;

        addScore(10);

        sound("correct");

        firstCard=null;
        secondCard=null;
        lockCards=false;

        if(matches===8){

            sound("win");

            nextLevel();

            document.getElementById("cardResult")
                .innerHTML=
                `<span class="correct">
                🏆 ALL PAIRS FOUND!
                </span>`;

        }

    }
    else{

        sound("wrong");

        setTimeout(()=>{

            firstCard.classList.remove("flipped");

            secondCard.classList.remove("flipped");

            firstCard.textContent="?";

            secondCard.textContent="?";

            firstCard=null;

            secondCard=null;

            lockCards=false;

        },700);

    }

}

let mathAnswer=0;


function numberRush(){

    document.getElementById("gameTitle").textContent=

    document.getElementById("gameContent").innerHTML=`

        <h2>🔢 SOLVE IT!</h2>

        <p class="instruction">

        </p>

        <div
            id="mathQuestion"

        >

        </div>

                id="mathTimer"

            ></div>
        </div>

function newMath(){

    clearInterval(timer);

    let max=
        Math.min(10+level*5,100);

    let a=
        Math.floor(Math.random()*max)+1;

    let b=
        Math.floor(Math.random()*max)+1;

    const operators=["+","-","×"];

    const op=
        operators[
            Math.floor(Math.random()*operators.length)
        ];

    if(op==="+"){

        mathAnswer=a+b;

    }

    else if(op==="-"){

        mathAnswer=a-b;

    }

    else{

        mathAnswer=a*b;

    }

    document.getElementById("mathQuestion")
        .textContent=
        `${a} ${op} ${b} = ?`;

    document.getElementById("mathInput")
        .value="";

    startMathTimer();

}


function startMathTimer(){

    const total=
        Math.max(2500,6000-level*100);

    const start=Date.now();

    timer=setInterval(()=>{

        const remaining=
            Math.max(
                0,
                total-(Date.now()-start)
            );

        document.getElementById("mathTimer")
            .style.width=
            (remaining/total*100)+"%";

        if(remaining<=0){

            clearInterval(timer);

            if(loseLife())return;

            document.getElementById("mathResult")
                .innerHTML=
                `<span class="wrong">
                ⏰ Too slow!
                </span>`;

            setTimeout(newMath,700);

        }

    },50);

}


function checkMath(){

    clearInterval(timer);

    const answer=
        Number(
            document.getElementById("mathInput").value
        );

    if(answer===mathAnswer){

        sound("correct");

        addScore(10+level);

        nextLevel();

        document.getElementById("mathResult")
            .innerHTML=
            `<span class="correct">
            ✅ Correct!
            </span>`;

        setTimeout(newMath,500);

    }

    else{

        sound("wrong");

        if(loseLife())return;

        document.getElementById("mathResult")
            .innerHTML=
            `<span class="wrong">
            ❌ Correct answer: ${mathAnswer}
            </span>`;

        setTimeout(newMath,800);

    }

}

function quickTap(){

        </div>

        ></div>

        <button
            class="primary"
            onclick="startTapRound()"
        >
            START
        </button>

    `;

}


function startTapRound(){

    clearTimeout(tapTimeout);

    const target=
        document.getElementById("tapTarget");

    target.textContent="WAIT...";

    target.style.background="#087346";

    let delay=
        1000+
        Math.random()*2500;

    tapTimeout=setTimeout(()=>{

        target.textContent="TAP!";

        target.style.background="#d4af37";

        target.dataset.ready="yes";

        target.dataset.start=
            Date.now();

    },delay);

}


function tapPressed(){

    const target=
        document.getElementById("tapTarget");

    if(target.dataset.ready!=="yes"){

        clearTimeout(tapTimeout);

        sound("wrong");

        document.getElementById("tapResult")
            .innerHTML=
            `<span class="wrong">
            ❌ Too early!
            </span>`;

        if(!loseLife()){

            setTimeout(startTapRound,700);

        }

        return;

    }

    const reaction=
        Date.now()-
        Number(target.dataset.start);

    target.dataset.ready="no";

    sound("correct");

    let points=
        Math.max(
            5,
            30-Math.floor(reaction/20)
        );

    addScore(points);

    nextLevel();

    document.getElementById("tapResult")
        .innerHTML=
        `<span class="correct">
        ⚡ ${reaction}ms! +${points}
        </span>`;

}

function oddOneOut(){

function newOddRound(){

    const symbols=
        ["🍎","🍌","🍇","🍉","⭐","🔥","🎯"];

    const normal=
        symbols[
            Math.floor(Math.random()*symbols.length)
        ];

    let odd;

    do{

        odd=
            symbols[
                Math.floor(Math.random()*symbols.length)
            ];

    }while(odd===normal);


    const total=
        Math.min(8+Math.floor(level/2),16);

    const oddIndex=
        Math.floor(Math.random()*total);

    const grid=
        document.getElementById("oddGrid");

    grid.innerHTML="";


    for(let i=0;i<total;i++){

        const b=
            document.createElement("button");

        b.className="choice";

        b.textContent=
            i===oddIndex?odd:normal;

        b.onclick=()=>{

            if(i===oddIndex){

                sound("correct");

                addScore(12);

                nextLevel();

                document.getElementById("oddResult")
                    .innerHTML=
                    `<span class="correct">
                    🎯 Correct!
                    </span>`;

                setTimeout(newOddRound,600);

            }

            else{

                sound("wrong");

                if(loseLife())return;

                document.getElementById("oddResult")
                    .innerHTML=
                    `<span class="wrong">
                    ❌ That's not it!
                    </span>`;

            }

        };

        grid.appendChild(b);

    }

}
