*{

}

  min-height:100vh;
  background:#080d19;
  color:white;
  overflow-x:hidden;

/* =========================
   LANDING PAGE
========================= */

.landing{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;

  background:
    radial-gradient(circle at 50% 20%,#173f67 0%,transparent 35%),
    radial-gradient(circle at 20% 80%,#35195d 0%,transparent 35%),
    #080d19;

  transition:.6s ease;
}

.landing.hidden{
  opacity:0;
  visibility:hidden;
  transform:scale(1.08);
}

.landing-card{
  width:100%;
  max-width:430px;
  text-align:center;
  padding:40px 25px;

  background:rgba(20,29,48,.85);
  backdrop-filter:blur(20px);

  border:1px solid rgba(255,255,255,.1);
  border-radius:30px;

  box-shadow:0 25px 80px rgba(0,0,0,.55);
}

.landing-brain{
  font-size:90px;
  display:block;
  margin-bottom:15px;
  animation:brainGlow 2s infinite;
}

@keyframes brainGlow{

  0%,100%{
    transform:scale(1);
    filter:drop-shadow(0 0 5px #12b76a);
  }

  50%{
    transform:scale(1.12);
    filter:drop-shadow(0 0 25px #12b76a);
  }

}

.landing-title{
  font-size:42px;
  font-weight:900;
  letter-spacing:2px;

  background:linear-gradient(
    90deg,
    #12b76a,
    #4cc9f0,
    #fdb022
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.landing-subtitle{
  margin-top:12px;
  color:#98a2b3;
  font-size:16px;
  line-height:1.5;
}

.landing-numbers{
  margin:25px auto;
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

.landing-numbers span{
  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#344054;
  border-radius:12px;

  font-weight:bold;
  font-size:18px;

  animation:numberFloat 2s infinite alternate;
}

.landing-numbers span:nth-child(2){animation-delay:.2s}
.landing-numbers span:nth-child(3){animation-delay:.4s}
.landing-numbers span:nth-child(4){animation-delay:.6s}
.landing-numbers span:nth-child(5){animation-delay:.8s}
.landing-numbers span:nth-child(6){animation-delay:1s}
.landing-numbers span:nth-child(7){animation-delay:1.2s}
.landing-numbers span:nth-child(8){animation-delay:1.4s}
.landing-numbers span:nth-child(9){animation-delay:1.6s}

@keyframes numberFloat{

  from{
    transform:translateY(0);
  }

  to{
    transform:translateY(-8px);
  }

}

.play-now{
  width:100%;
  padding:17px;

  border:none;
  border-radius:16px;

  background:#12b76a;
  color:white;

  font-size:19px;
  font-weight:bold;

  cursor:pointer;

  box-shadow:0 8px 30px rgba(18,183,106,.35);

  transition:.2s;
}

.play-now:hover{
  transform:translateY(-3px);
  background:#16c77a;
}

.landing-info{
  margin-top:15px;
  color:#667085;
  font-size:12px;
}
